name: Sentri investor lead sync

# ONE long-running job that polls every 60 seconds, instead of asking GitHub's
# cron to start a job every 5 minutes.
#
# WHY. The `*/5` schedule does not work on this repo and never did. Over
# 2026-11-04..10, GitHub started 24 scheduled runs out of ~1,750 due: 3 to 5 a
# day, 3 to 11 hours apart, with no improvement over time. Every run that does
# start succeeds in about 9 seconds, so nothing ever looked broken - leads just
# arrived in Notion a typical 3 hours late, worst case 8. On 2026-11-11 two
# leads sat in Meta for 4 hours while Notion looked empty, which is what finally
# surfaced it.
#
# `workflow_dispatch` starts instantly and always has. So the fix is to stop
# needing the scheduler: when a job does start, it stays up and does the polling
# itself in a loop. Latency goes from ~3 hours to ~60 seconds.
#
# WHY THIS IS FREE. The repo is PUBLIC, so Actions minutes are unlimited. On a
# private repo this pattern would cost ~350 billed minutes per run and is not an
# option - see the note at the bottom.
#
# HOW THE CHAIN KEEPS ITSELF ALIVE. A job can run at most 6 hours, so each one
# covers ~5h45m and then exits. The `concurrency` group is what restarts it:
# while a job is running, any cron-triggered run goes PENDING instead of being
# dropped, and GitHub keeps one pending run per group. The moment the long job
# finishes, that pending run takes over. Since cron fires 3-5 times a day and
# each job covers nearly 6 hours, there is almost always one queued and ready.
#
# GITHUB_TOKEN cannot be used to re-dispatch this workflow from inside itself -
# GitHub blocks token-triggered events from starting new runs, to stop
# runaway recursion. That is why the chain uses the pending-run trick above
# rather than a self-dispatch, and why no PAT is needed.
#
# A missed or late pass still costs nothing: every pass re-reads every lead on
# the form, so the system self-heals rather than losing anything.
on:
  schedule:
    # Fires rarely in practice (see above). Its only job now is to queue the
    # next long run behind the current one. Kept off the hour boundary.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Only one at a time, and DO NOT cancel the running one - it IS the poller.
# A queued run here is a feature: it is the hand-off for the next 6-hour shift.
concurrency:
  group: lead-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hard ceiling is 6h/360min. Loop stops at 345min, leaving margin to push
    # final state and exit cleanly rather than being killed mid-write.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only - nothing to install.
      - name: Poll Meta every 60s and push leads to Notion
        shell: bash
        env:
          SENTRI_META_TOKEN: ${{ secrets.SENTRI_META_TOKEN }}
          SENTRI_PAGE_ID: ${{ secrets.SENTRI_PAGE_ID }}
          NOTION_INVESTOR2_TOKEN: ${{ secrets.NOTION_INVESTOR2_TOKEN }}
          NOTION_INVESTOR2_DB: ${{ secrets.NOTION_INVESTOR2_DB }}
        run: |
          git config user.name  "sentri-lead-sync"
          git config user.email "noreply@github.com"

          INTERVAL=60
          END=$(( $(date +%s) + 345*60 ))
          PASS=0

          while [ "$(date +%s)" -lt "$END" ]; do
            PASS=$((PASS+1))
            echo "::group::pass $PASS  $(date -u +%H:%M:%SZ)"

            # `|| true` on both: a transient Notion 502 or Meta hiccup must not
            # kill a 6-hour poller. The next pass re-reads everything anyway.
            python sync_buyers.py  --once || echo "  sync pass failed"
            python qualify_leads.py --once || echo "  qualify pass failed"

            # The state files are the ONLY durable record that a lead was
            # handled. A Notion query cannot stand in: archived rows are not
            # returned, so a lead Julian deletes would be re-imported forever.
            # Committing them back is what makes a delete stick.
            if ! git diff --quiet synced_buyers.json qualified_sent.json; then
              git add synced_buyers.json qualified_sent.json
              git commit -q -m "state: $(date -u +'%Y-%m-%dT%H:%MZ')"
              # Rebase first: a code push from Julian would otherwise make this
              # push fail and silently strand the state for the rest of the run.
              for try in 1 2 3; do
                git pull --rebase -q origin master && git push -q origin master && break
                echo "  state push retry $try"
                sleep 5
              done
            fi

            echo "::endgroup::"
            sleep "$INTERVAL"
          done

          echo "shift complete after $PASS passes"

# IF THIS REPO IS EVER MADE PRIVATE: this workflow becomes unaffordable
# immediately. The free plan allows 2000 Actions minutes/month; one 345-minute
# run would eat a sixth of that, and the chain runs continuously. Revert to a
# short job on a "7,37 * * * *" cron in the same commit, and accept the latency.
