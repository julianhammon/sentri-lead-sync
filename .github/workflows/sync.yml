name: Sentri investor lead sync

# Runs on GitHub's runners, not Julian's PC.
#
# Minutes 7 and 37 - twice an hour - NOT "*/5". The reason is cost, and it is a
# hard ceiling:
#
#   This repo is PRIVATE, so the free plan allows 2000 Actions minutes/month, and
#   GitHub bills a WHOLE MINUTE per run however short it is. A real run takes
#   about 9 seconds. So 48 runs/day = ~1440 billed min/month, which fits with
#   room for manual dispatches. "*/5" would be ~8600 min/month - over 4x the
#   allowance - and when the allowance runs out the runs just stop. Silently.
#
# Separately, be patient with a NEW repo: the first scheduled run on this one did
# not fire until ~5 hours after creation, while workflow_dispatch worked
# instantly the whole time. That is GitHub cold-starting the schedule, not a
# broken cron. Do not go chasing it. Dispatch manually if a lead is needed now:
#   gh workflow run sync.yml --repo julianhammon/sentri-lead-sync
#
# If this repo is ever made public, Actions minutes become unlimited and the
# cadence can go to every 5 minutes for free. Nothing here blocks that: the only
# data committed is opaque Meta lead IDs, and secrets stay encrypted either way.
#
# A dropped or late run costs nothing: the sync re-reads every lead on the form
# each pass, so it self-heals on the next one.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Only one run at a time. Two concurrent runs would both try to commit the state
# files and the loser would fail the push.
concurrency:
  group: lead-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only - nothing to install.
      - name: Pull new leads into Notion
        env:
          SENTRI_META_TOKEN: ${{ secrets.SENTRI_META_TOKEN }}
          SENTRI_PAGE_ID: ${{ secrets.SENTRI_PAGE_ID }}
          NOTION_INVESTOR2_TOKEN: ${{ secrets.NOTION_INVESTOR2_TOKEN }}
          NOTION_INVESTOR2_DB: ${{ secrets.NOTION_INVESTOR2_DB }}
        run: python sync_buyers.py --once

      - name: Send qualified verdicts back to Meta
        env:
          SENTRI_META_TOKEN: ${{ secrets.SENTRI_META_TOKEN }}
          SENTRI_PAGE_ID: ${{ secrets.SENTRI_PAGE_ID }}
          NOTION_INVESTOR2_TOKEN: ${{ secrets.NOTION_INVESTOR2_TOKEN }}
          NOTION_INVESTOR2_DB: ${{ secrets.NOTION_INVESTOR2_DB }}
        run: python qualify_leads.py --once

      # The state files are the ONLY durable record that a lead was already
      # handled. A Notion query cannot stand in for them: archived rows are not
      # returned, so a lead Julian deletes would be re-imported on the next pass
      # and reappear forever. Committing them back is what makes a delete stick.
      - name: Persist state
        run: |
          git config user.name  "sentri-lead-sync"
          git config user.email "noreply@github.com"
          git add synced_buyers.json qualified_sent.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
